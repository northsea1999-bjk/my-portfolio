<script>
(function(){
'use strict';
var main=document.getElementById('main-content'), params=new URLSearchParams(location.search), state=params.get('state')||'normal';
var zoom=params.get('text')==='200'?2:1, current='', positions={};
var welcomeKey='hokuto-classroom-welcome-v2', welcomed=false;
try{welcomed=localStorage.getItem(welcomeKey)==='seen';}catch(e){}
var initialRoute=!location.hash&&!params.has('state')&&!params.has('preview')&&!welcomed?'welcome':'today';
function rememberWelcome(){initialRoute='today';if(params.get('preview')!=='1'){try{localStorage.setItem(welcomeKey,'seen');}catch(e){}}}
function entryArt(){return '<figure class="entry-art"><img src="assets/entry-mobile-v2.webp" width="1774" height="887" alt="푸른 바다 옆 북두 가게의 왼쪽 장면" fetchpriority="high"></figure>';}
function welcome(){return '<div class="welcome">'+entryArt()+'<div class="eyebrow">바닷가의 작은 투자 이야기</div><h1 tabindex="-1">오늘의 북두</h1><p class="welcome-copy">바닷가의 작은 집에서,<br>오늘의 소식을 함께 살펴봐요.</p><a class="button" href="#today" data-enter>오늘 소식 보기 <span aria-hidden="true">→</span></a><a class="skip-entry" href="#today" data-enter>건너뛰기</a></div>';}
function space(){return back('rooms','전체로 돌아가기')+title('공간 보기','오늘의 북두','바닷가의 작은 집과 매일 만나는 라운지입니다.')+entryArt()+'<p class="meta">가게 · 처음 한 번 만나는 북두의 입구</p><figure class="space-art"><img src="assets/lounge-mobile-v2.webp" width="1000" height="500" alt="바다 창문과 안내원이 있는 라운지" loading="lazy"><figcaption>라운지 · 매일 소식을 읽는 공간</figcaption></figure><a class="button section" href="#today">오늘 화면으로</a>';}

document.documentElement.style.fontSize=(16*zoom)+'px';
var scenes='<figure class="scene"><img src="assets/lounge-mobile-v2.webp" width="1000" height="500" alt="바다를 바라보는 북두 라운지와 여성 안내원" fetchpriority="high"><span class="scene-label">북두의 라운지</span></figure>';
var rooms=[
['news','오늘의 소식','뉴스룸','확인된 기사와 아직 분석 중인 내용을 구분합니다.'],
['research','발견의 서재','리서치센터','관심이 모이는 테마와 그 이유를 확인합니다.'],
['candidates','후보 살롱','펀드매니저실 · 종목검증실','후보가 된 이유와 미충족 조건을 비교합니다.'],
['decision','판단의 책상','사장실 · 결정실','기대 근거와 반대 근거를 함께 확인합니다.'],
['signals','신호 관측실','BNF 신호실','신호 발생 여부와 다음 확인 조건을 살핍니다.'],
['holdings','내 투자 데스크','트레이딩룸 · 보유 / 신규매수','보유종목과 신규매수의 입구를 구분합니다.'],
['records','돌아보기 서가','성과기록 · 선정성적','두 평가의 기준과 결과를 따로 봅니다.']
];
function title(k,t,p){return '<div class="page-title"><div class="eyebrow">'+k+'</div><h1 tabindex="-1">'+t+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>';}
function back(h,t){return '<a class="back" href="#'+h+'">← '+t+'</a>';}
function card(h,tag,name,copy,act){return '<a class="card card-link" href="#'+h+'"><div class="card-top"><span class="status">'+tag+'</span><span class="meta">가상 예시</span></div><h3>'+name+'</h3><p class="meta">'+copy+'</p><div class="card-action"><span>'+act+'</span><span aria-hidden="true">→</span></div></a>';}
function stateHome(){
if(state==='loading')return scenes+title('오늘 브리핑','소식을 불러오는 중이에요','')+'<div class="state-box" role="status" aria-live="polite"><div class="skeleton title"></div><div class="skeleton"></div><div class="skeleton short"></div><p>새 자료를 확인하고 있어요.</p><button class="button secondary" data-normal>완료 화면 보기</button></div>';
if(state==='empty')return '<div class="quiet-guide"><span class="guide-portrait" role="img" aria-label="북두 안내원"></span><div><b>북두 안내원</b><p>오늘도 차분히 확인해 봤어요.</p></div></div>'+title('오늘 브리핑','새로 확인된 변화가 없어요','')+'<div class="state-box"><p>자료 확인은 끝났습니다. 새 소식이 없어도 기존 종목과 기록은 볼 수 있어요.</p><a class="button" href="#holdings">내 주식 보기</a><p class="meta">가상 자료 확인 시각 · 10/11 08:30</p></div>';
if(state==='error')return scenes+title('오늘 브리핑','새 소식을 가져오지 못했어요','')+'<div class="notice error" role="status">현재 상태를 확인하지 못했습니다. “변화 없음”으로 판단하지 않습니다.</div><div class="state-box section"><p>다시 불러오거나, 마지막으로 확인한 자료를 볼 수 있어요.</p><button class="button" data-normal>다시 불러오기</button><a class="button secondary section" href="?state=stale#today">마지막 자료 보기</a><p class="meta">이 버튼은 가상 정상 화면으로 전환합니다.</p></div>';
return scenes+'<div class="brief"><div class="eyebrow">오늘의 브리핑</div><h1 tabindex="-1">새 소식 2건이 있어요.</h1><aside class="guide-line" aria-label="안내원의 말"><b>북두 안내원</b><p>중요한 소식부터 함께 살펴볼게요.</p></aside><p class="meta">가상 자료 기준 · '+(state==='stale'?'10/10 17:30':'10/11 08:30')+'</p>'+(state==='stale'?'<div class="notice" role="status"><strong>이전 자료입니다.</strong><br>새 자료 갱신 여부를 확인하지 못했어요.</div>':'')+'<a class="button" href="#news">소식 읽기 <span aria-hidden="true">→</span></a></div><div class="notice"><strong>일부 기사 분석 대기</strong><br>미분석 기사 1건은 관련 여부가 아직 미확인입니다.</div><section class="section"><div class="section-head"><h2>이어서 볼 내용</h2><small>가상 예시</small></div><div class="cards dual">'+card('holdings','관련성 확인 중','내 주식의 새 소식','기사 내용과 종목의 관계를 먼저 확인해요.','내 주식 보기')+card('candidates','신호 없음','후보가 기다리는 조건','아직 채워지지 않은 조건을 확인해요.','후보 살펴보기')+'</div></section>';
}
function news(){return back('today','오늘로 돌아가기')+title('오늘의 소식 · 뉴스룸','무슨 일이 있었나요?','사실을 먼저 읽고, 영향은 근거와 함께 살펴보세요.')+'<div class="notice">가상 기사 1건 분석 대기 · 미확인 내용은 결론에 포함하지 않습니다.</div><section class="section cards"><h2 class="sr-only">기사 목록</h2>'+card('article','사실 확인 예시','가상기업 A, 설비 투자 계획 발표','발표 내용과 실적에 미치는 영향은 구분해서 봅니다.','이유와 근거 읽기')+card('article-b','영향 미확인','가상기업 B 관련 업종 수요 보도','업종 소식이 해당 회사의 매출로 이어지는지는 미확인입니다.','미확인 사항 읽기')+'</section>';}
function article(b){return back('news','소식 목록')+title('가상 기사 · 화면 구성 예시',b?'업종 수요 보도, 어디까지 알 수 있나요?':'투자 계획과 실적 영향은 따로 봅니다.','')+'<div class="reading"><section><div class="eyebrow">한눈에 요약</div><p>'+(b?'업종 수요에 대한 보도가 있습니다. 가상기업 B의 실제 수주나 매출 변화는 확인되지 않았습니다.':'가상기업 A가 설비 투자 계획을 발표했다는 상황입니다. 실제 공시가 아닌 화면 설명용 예시입니다.')+'</p><p class="meta">자료 기준 · 10/11 08:30 (가상)</p></section><section><h2>확인된 사실</h2><p>실제 구현에서는 원문에 적힌 발표 내용·기간·수치만 이곳에 표시합니다.</p></section><section><h2>아직 모르는 것</h2><p>매출과 이익에 미치는 규모, 실현 시점, 해당 종목과의 직접 관계는 확인 전입니다.</p><div class="notice">이 문장은 매수·매도 신호가 아닙니다.</div></section><section><h2>다음 확인</h2><p>회사 공시에서 투자 금액과 기간, 공식 전망 변경 여부를 확인합니다.</p></section><details><summary>근거 표시 예시 보기</summary><dl><dt>문서</dt><dd>가상 공시 요약 · 실제 문서 없음</dd><dt>시각</dt><dd>10/11 08:30 (가상)</dd><dt>원문 연결</dt><dd>운영 연결 때 실제 출처 링크를 표시합니다.</dd></dl></details></div><a class="button secondary section" href="#news">다른 소식 보기</a>';}
function holdings(){return title('내 투자 데스크','내 주식부터 살펴봐요.','변화와 미확인 사항을 먼저 보여줍니다.')+'<div class="notice">보유종목 A·B는 디자인용 가상 종목입니다.</div><section class="section cards"><h2 class="sr-only">보유종목 목록</h2>'+card('holding-a','관련성 확인 중','가상 보유종목 A','새 소식이 있습니다. 직접 영향은 아직 확인 중이에요.','관련 소식 보기')+card('holding-b','새 변화 없음','가상 보유종목 B','마지막 확인 이후 새로 표시할 변화가 없어요.','확인 내용 보기')+'</section><a class="button secondary section" href="#candidates">신규매수 후보 보기</a>';}
function holding(b){return back('holdings','내 주식 목록')+title('내 투자 데스크',b?'가상 보유종목 B':'가상 보유종목 A','수량·평단·계좌 정보는 포함하지 않은 예시입니다.')+'<div class="reading"><section><h2>현재 확인</h2><p>'+(b?'새로 확인된 변화가 없습니다.':'종목과 관련 있을 수 있는 소식이 있습니다. 직접적인 영향은 확인되지 않았습니다.')+'</p><p class="meta">가상 자료 · 10/11 08:30</p></section><section><h2>다음에 볼 것</h2><p>기사와 실제 회사 관계, 공식 공시의 변경 사항을 확인합니다.</p></section></div><a class="button section" href="#news">관련 소식 살펴보기</a>';}
function candidates(){return title('후보 살롱','서두르지 않고,<br>조건부터 확인해요.','펀드매니저실과 종목검증실의 입구를 구분합니다.')+'<div class="cards"><article class="card"><div class="card-top"><span class="status wait">신호 없음</span><span class="meta">가상 후보 C</span></div><h2>매수 타이밍</h2><p class="meta">아직 진입 조건이 모두 충족되지 않았습니다.</p><a class="button secondary section" href="#candidate">이유와 다음 확인 보기</a></article></div><ul class="room-list section"><li><a href="#manager"><span>펀드매니저실<small>후보가 선정된 이유</small></span><span aria-hidden="true">→</span></a></li><li><a href="#verification"><span>종목검증실<small>실적과 미충족 조건</small></span><span aria-hidden="true">→</span></a></li></ul>';}
function candidate(){return back('candidates','후보 목록')+title('가상 후보 C','신호가 아직 없어요.','')+'<div class="reading"><section><div class="status wait">매수 타이밍 · 신호 없음</div><p style="margin-top:12px">후보에 올랐다는 사실만으로 매수 조건이 완성되지는 않습니다.</p></section><section><h2>이유</h2><p>기존 프로그램이 계산한 미충족 조건을 이곳에 그대로 표시합니다. 이 예시에서는 신호를 계산하지 않습니다.</p></section><section><h2>다음 확인</h2><p>다음 자료 갱신 때 조건의 변화와 반대 근거를 함께 확인합니다.</p></section></div><a class="button secondary section" href="#verification">종목검증실 보기</a>';}
function records(){return title('돌아보기 서가','지난 판단을<br>같은 기준으로 돌아봐요.','성과기록과 선정성적은 서로 다른 항목입니다.')+'<h2 class="sr-only">기록의 종류</h2><div class="cards">'+card('performance','평가 대기','성과기록','기록된 판단의 후속 결과를 확인합니다.','성과기록 보기')+card('selection','평가 대기','선정성적','선정된 종목과 비교 기준을 함께 봅니다.','선정성적 보기')+'</div><div class="notice">평가 기간이 지나지 않은 항목을 성과 0으로 표시하지 않습니다.</div>';}
function allrooms(){return title('전체 방','어느 방으로 갈까요?','익숙한 기존 방 이름도 함께 표시합니다.')+'<a class="card card-link space-link" href="#space"><h2>공간 보기 <span aria-hidden="true">→</span></h2><p>북두의 가게와 라운지를 둘러보세요.</p></a>'+'<ul class="room-list">'+rooms.map(function(r){return '<li><a href="#'+r[0]+'"><span>'+r[1]+'<small>'+r[2]+'</small></span><span aria-hidden="true">→</span></a></li>';}).join('')+'</ul>';}
var extra={
research:['발견의 서재','리서치센터','테마와 자금 흐름을 살펴봅니다.','선정 이유와 자료 기준 시각을 먼저 표시합니다.'],
decision:['판단의 책상','사장실 · 결정실','기대 근거와 반대 근거를 함께 봅니다.','기존 판정과 보류 사유를 그대로 읽습니다.'],
signals:['신호 관측실','BNF 신호실','조건이 실제로 나타났는지 확인합니다.','발생일과 충족·미충족 조건을 구분합니다.'],
manager:['후보 선정','펀드매니저실','왜 후보에 올랐는지 살펴봅니다.','대표 여부와 선정 근거를 확인합니다.'],
verification:['후보 검증','종목검증실','실적과 미충족 조건을 확인합니다.','기간과 단위가 같은 자료로 비교합니다.'],
performance:['성과기록','돌아보기 서가','과거 판단의 이후 결과를 봅니다.','평가 대기·완료·제외 이유를 구분합니다.'],
selection:['선정성적','돌아보기 서가','선정 이후 결과를 비교 기준과 함께 봅니다.','성과기록과 분모·기간을 혼합하지 않습니다.']
};
function generic(k){var r=extra[k];return back(k==='manager'||k==='verification'?'candidates':k==='performance'||k==='selection'?'records':'rooms','목록으로 돌아가기')+title(r[1],r[0],r[2])+'<div class="reading"><section><div class="status muted">구성 예시</div><p style="margin-top:12px">'+r[3]+'</p></section><section><h2>공통 읽기 순서</h2><p>현재 상태 → 이유와 반대 근거 → 다음 확인 → 출처.</p><p class="meta">이 방은 화면 구조를 설명하는 예시입니다. 실제 수치와 판정은 연결하지 않았습니다.</p></section></div>'+(k==='decision'?'<ul class="room-list section"><li><a href="#chair"><span>사장실<small>오늘의 종합 요약</small></span><span>→</span></a></li><li><a href="#decision-detail"><span>결정실<small>종목별 근거 확인</small></span><span>→</span></a></li></ul>':'');}
function active(k){if(['today','news','article','article-b'].includes(k))return'today';if(['holdings','holding-a','holding-b'].includes(k))return'holdings';if(['candidates','candidate','manager','verification'].includes(k))return'candidates';if(['records','performance','selection'].includes(k))return'records';return'rooms';}
function render(){
var k=location.hash.slice(1)||initialRoute;if(k==='main-content')k=current||'today';
var html=k==='welcome'?welcome():k==='space'?space():k==='today'?stateHome():k==='news'?news():k==='article'||k==='article-b'?article(k==='article-b'):k==='holdings'?holdings():k==='holding-a'||k==='holding-b'?holding(k==='holding-b'):k==='candidates'?candidates():k==='candidate'?candidate():k==='records'?records():k==='rooms'?allrooms():extra[k]?generic(k):'';
if(k==='chair'||k==='decision-detail')html=back('decision','판단의 책상')+title('구성 예시',k==='chair'?'사장실':'결정실','')+'<div class="reading"><h2>기존 기능의 독립된 입구</h2><p class="section">두 기능을 하나의 판정으로 합치지 않습니다. 실제 데이터 연결 때 각 화면의 원래 기능으로 이동합니다.</p></div>';
if(!html){k='today';html=stateHome();}
document.querySelector('.bottom-nav').hidden=k==='welcome';main.classList.toggle('is-welcome',k==='welcome');
main.innerHTML=html+'<p class="hint">실제 투자 정보가 아닌 디자인 예시입니다.<br><a href="plan.html" target="_top">2차 기획서 읽기 →</a></p>';
document.querySelectorAll('[data-nav]').forEach(function(a){if(a.dataset.nav===active(k))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
current=k;var h=main.querySelector('h1');if(h)h.focus({preventScroll:true});window.scrollTo(0,positions[k]||0);
}
document.addEventListener('click',function(e){
var a=e.target.closest('a[href^="#"]');if(a)positions[current]=window.scrollY;
if(a&&current==='welcome'&&a.getAttribute('href')!=='#main-content'){rememberWelcome();if(a.hasAttribute('data-enter')){e.preventDefault();history.replaceState(null,'','#today');render();updateNav();return;}}
if(e.target.closest('[data-normal]')){state='normal';render();}
});
document.getElementById('read-toggle').addEventListener('click',function(){
zoom=zoom>1?1:1.125;document.documentElement.style.fontSize=(16*zoom)+'px';this.setAttribute('aria-pressed',String(zoom>1));this.textContent=zoom>1?'가 −':'가 +';this.setAttribute('aria-label',zoom>1?'기본 글자 크기로 보기':'글자 크게 보기');updateNav();
});
function updateNav(){document.documentElement.style.setProperty('--nav-space',(document.querySelector('.bottom-nav').getBoundingClientRect().height+8)+'px');}
window.addEventListener('hashchange',render);window.addEventListener('resize',updateNav);render();updateNav();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(updateNav).observe(document.querySelector('.bottom-nav'));
})();
</script>
