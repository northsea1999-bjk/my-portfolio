<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill — Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --cream:#f3ece2; --ink:#171512; --gold:#b5893f; --gold-soft:#c9a76b;
  --dark:#141210; --line:rgba(23,21,18,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}
.shell{max-width:1320px;margin:0 auto;padding:0 5%}

/* ---------- section shells (style-b-colorful.html 원본 그대로) ---------- */
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.sec-head .lbl{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--gold-soft)}
.sec-head a{font-size:11px;font-weight:700;letter-spacing:.08em;color:#cfc8ba;display:flex;align-items:center;gap:8px}

/* ---------- skill (standalone, 원본 그대로) ---------- */
.skill-sec{padding:40px 0 120px}
.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.skill-card{background:#fff;padding:26px 22px}
.skill-card .k{font-size:11px;font-weight:800;letter-spacing:.1em;color:#a39c8d;margin-bottom:10px}
.skill-card .v{font-size:18px;font-weight:800}

@media(max-width:960px){
  .skill-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<section class="skill-sec">
  <div class="shell">
    <div class="sec-head"><div class="lbl">SKILL</div></div>
    <div class="skill-grid">
      <div class="skill-card"><div class="k">FRONTEND</div><div class="v">HTML / CSS</div></div>
      <div class="skill-card"><div class="k">FRONTEND</div><div class="v">JavaScript</div></div>
      <div class="skill-card"><div class="k">VERSION CONTROL</div><div class="v">Git · GitHub</div></div>
      <div class="skill-card"><div class="k">BACKEND</div><div class="v">Supabase</div></div>
      <div class="skill-card"><div class="k">WORKFLOW</div><div class="v">Claude Code</div></div>
      <div class="skill-card"><div class="k">DESIGN</div><div class="v">반응형 레이아웃</div></div>
    </div>
  </div>
</section>

</body>
</html>
